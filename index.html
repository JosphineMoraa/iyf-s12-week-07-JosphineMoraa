<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple to-do list built with clean, testable JavaScript."
    />
    <title>My To-Do List | Week 7</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main class="container">
      <header class="page-header">
        <p class="eyebrow">IYF Weekend Academy · Season 12 · Week 7</p>
        <h1>My To-Do List</h1>
        <p class="intro">Add tasks, mark them complete, or remove them.</p>
      </header>

      <section class="todo-card" aria-labelledby="todo-heading">
        <h2 id="todo-heading">My tasks</h2>
        <div class="input-section">
          <label class="visually-hidden" for="task-input">New task</label>
          <input
            type="text"
            id="task-input"
            placeholder="What do you need to do?"
            autocomplete="off"
          />
          <button id="add-btn" type="button">Add task</button>
        </div>
        <p id="message" class="message" role="status" aria-live="polite"></p>
        <ul id="task-list" class="task-list" aria-label="Tasks"></ul>
      </section>
    </main>
  </body>
</html>
