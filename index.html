<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 7 To-Do List</title><link rel="stylesheet" href="styles.css"><script type="module" src="js/app.js"></script></head>
<body><main class="app"><header><p class="eyebrow">IYF Weekend Academy · Season 12 · Week 7</p><h1>To-Do List</h1></header>
<form id="task-form"><label for="task-input">New task</label><input id="task-input" type="text" placeholder="What needs doing?" autocomplete="off"><button type="submit">Add</button></form><p id="error" class="error hidden" role="alert"></p>
<nav id="filters" class="filters" aria-label="Filter tasks"><button type="button" data-filter="all" class="active" aria-pressed="true">All</button><button type="button" data-filter="active" aria-pressed="false">Active</button><button type="button" data-filter="completed" aria-pressed="false">Completed</button></nav>
<ul id="task-list" aria-live="polite"></ul><footer class="footer"><span id="count">0 items left</span><button type="button" id="clear-completed">Clear Completed</button></footer><p><a href="cart/index.html">Lesson 13 Shopping Cart</a></p></main></body></html>
